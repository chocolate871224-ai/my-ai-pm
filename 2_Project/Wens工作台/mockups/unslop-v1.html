<meta charset="utf-8">
<title>Wen's 工作台改版示意</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap&text=%F0%9F%A5%AF%E2%9C%85%F0%9F%93%85%F0%9F%92%BC%F0%9F%93%9D%F0%9F%94%96%F0%9F%92%A1%F0%9F%A7%BE%F0%9F%A7%80%F0%9F%8D%9E%F0%9F%A5%90%F0%9F%8D%A9%F0%9F%8F%AD%F0%9F%9A%9A%F0%9F%8F%AA%F0%9F%A7%8A%F0%9F%98%8B%F0%9F%98%AE%F0%9F%99%82%F0%9F%A4%9D%F0%9F%8F%A0%F0%9F%8F%AC%E2%9C%8E%F0%9F%93%8B%F0%9F%94%84">
<style>
/* Layout: Wen's AppShell — white top bar + white sidebar (line icons, grey active pill) + grey canvas + white sheet with two rounded top corners. Brand green only inside the sheet. */
:root{
  --shell:#ffffff; --canvas:#f2f2f2; --sheet:#ffffff; --nav-active:#f0f0f0; --nav-hover:#f5f5f5; --shell-line:#e4e4e4; --icon:#2a2d2b;
  --ink:#1f2421; --muted:#66706a; --line:#dde3de; --surface:#ffffff; --bg:#f3f5f2;
  --accent:#2f7a4f; --bubble-me:#c9efb4; --bubble-me-ink:#1b2a14; --chat:#dfe8ec;
  --tag-calendar:#2f6db3; --tag-sheet:#1a7a50; --tag-warn:#9c5414;
  --scrim:rgba(20,20,20,.3);
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --shell:#1a1b1a; --canvas:#111211; --sheet:#1a1b1a; --nav-active:#2a2b2a; --nav-hover:#232423; --shell-line:#2d2f2d; --icon:#d6d9d6;
  --ink:#e7ece8; --muted:#9aa59e; --line:#2e3632; --surface:#1d2320; --bg:#141816;
  --accent:#6cc290; --bubble-me:#3d6b2c; --bubble-me-ink:#eef7e8; --chat:#22303a;
  --tag-calendar:#7fb0ea; --tag-sheet:#5fcf98; --tag-warn:#e3a061; --scrim:rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --shell:#1a1b1a; --canvas:#111211; --sheet:#1a1b1a; --nav-active:#2a2b2a; --nav-hover:#232423; --shell-line:#2d2f2d; --icon:#d6d9d6;
  --ink:#e7ece8; --muted:#9aa59e; --line:#2e3632; --surface:#1d2320; --bg:#141816;
  --accent:#6cc290; --bubble-me:#3d6b2c; --bubble-me-ink:#eef7e8; --chat:#22303a;
  --tag-calendar:#7fb0ea; --tag-sheet:#5fcf98; --tag-warn:#e3a061; --scrim:rgba(0,0,0,.5); color-scheme:dark }

/* one accent: brand forest green (accent). Pale green (bubble-me) is the only highlight fill. */
:root{--em:#2f7a4f; --em-ink:#ffffff; --hl:#c9efb4; --hl-ink:#1b2a14; --mark:#c9efb4;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--em:#6cc290; --em-ink:#10271a; --hl:#3d6b2c; --hl-ink:#eef7e8; --mark:rgba(108,194,144,.32);}}
:root[data-theme="dark"]{--em:#6cc290; --em-ink:#10271a; --hl:#3d6b2c; --hl-ink:#eef7e8; --mark:rgba(108,194,144,.32);}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:15px/24px var(--sans);display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top */
.top{flex:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;background:var(--shell);border-bottom:1px solid var(--shell-line);
  display:flex;align-items:center;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shell)}
.icon-btn{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--icon);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--nav-hover)}
.menu-btn{display:none}
.switcher{height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:16px;line-height:1;font-weight:500;cursor:pointer}
.switcher .ic{width:16px;height:16px;color:var(--muted)}
.avatar{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--em);color:var(--em-ink);display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:14px;font-weight:600}

.app{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}
.side{background:var(--shell);border-right:1px solid var(--shell-line);display:flex;flex-direction:column;gap:12px;
  padding:12px 8px 16px;padding-left:max(8px,env(safe-area-inset-left,0px));position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto}
.search{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;background:var(--nav-active);border-radius:10px;color:var(--muted)}
.search .ic{width:18px;height:18px}
.search input{border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);width:100%;min-width:0;outline:none;height:100%}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;height:36px;padding:0 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1}
.nav-item .ic{color:var(--icon)}
.nav-item:hover{background:var(--nav-hover)}
.nav-item[aria-current="page"]{background:var(--nav-active)}
.nav-item .count{font-size:13px;color:var(--muted)}
.divider{height:1px;background:var(--shell-line);margin:2px 0}

.canvas{min-width:0;padding:28px 28px 0}
.sheet{background:var(--sheet);border:1px solid var(--shell-line);border-bottom:0;border-radius:16px 16px 0 0;min-height:100%;padding:36px 40px 64px}
.wrap{max-width:880px;display:flex;flex-direction:column;gap:28px}

/* page typography */
.eyebrow{font-size:13px;line-height:20px;color:var(--muted);font-weight:600}
h1{font-size:22px;line-height:30px;margin:4px 0 0;text-wrap:balance}
header.ph{padding-bottom:20px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;gap:12px}
.emo{width:44px;height:44px;border-radius:12px;background:var(--bg);flex:none;display:inline-flex;align-items:center;justify-content:center;
  font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif;font-size:26px;line-height:1;font-weight:400}
mark{background:linear-gradient(transparent 60%,var(--mark) 60%);color:var(--ink);padding:0 2px}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.progress .track{flex:1;height:8px;border-radius:4px;background:var(--nav-active);overflow:hidden}
.progress .fill{height:100%;background:var(--em);border-radius:4px}
.lede{color:var(--muted);margin:4px 0 0}
h2{font-size:17px;line-height:24px;margin:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{font-size:13px;line-height:20px;color:var(--muted)}

.btn{height:36px;padding:0 14px;border-radius:8px;font-size:14px;line-height:1;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet)}
.btn:hover{background:var(--nav-hover)}
.btn.primary{background:var(--em);border-color:var(--em);color:var(--em-ink)}
.btn.primary:hover{filter:brightness(.94);background:var(--em)}
.btn .ic{width:18px;height:18px}
.btn.sm{height:28px;padding:0 10px;font-size:13px;font-weight:600}
.tag{height:24px;padding:0 10px;border-radius:999px;border:1px solid currentColor;font-size:12px;line-height:1;font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.t-cal{color:var(--tag-calendar)} .t-sheet{color:var(--tag-sheet)} .t-warn{color:var(--tag-warn)} .t-plain{color:var(--muted)}
.sample{font-size:12px;line-height:1;color:var(--muted);height:24px;padding:0 10px;border:1px dashed var(--line);border-radius:999px;display:inline-flex;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-size:13px;line-height:1;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--em);border-color:var(--em);color:var(--em-ink);font-weight:600}
.chip .n{color:inherit;opacity:.7}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat .k{font-size:13px;line-height:20px;font-weight:600;color:var(--muted)}
.stat .v{font-size:24px;line-height:32px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:600;margin-left:2px}
.stat .d{font-size:12px;line-height:18px;color:var(--muted)}
.stat.hl{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.stat.hl .k,.stat.hl .d{color:var(--hl-ink)}

/* bread */
.strip{display:flex;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.seg{display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0;border-right:1px solid var(--sheet)}
.seg:last-child{border-right:0}
.seg.s0{background:var(--em);color:var(--em-ink)}
.seg.s1{background:var(--hl);color:var(--hl-ink)}
.seg.s2{background:var(--chat);color:var(--ink)}
.seg.s3{background:var(--nav-active);color:var(--ink)}
.strip-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.batch{display:flex;flex-direction:column;gap:10px}
.batch-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.batch-head h3{font-size:15px;line-height:1.3;margin:0}
.batch-head .sum{font-size:13px;color:var(--muted);margin-left:auto}
.brands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.brand{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.brand-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand-top b{font-size:14px}
.brand-top span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:4px 0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 14px;min-height:40px}
.item .nm{font-size:14px;line-height:20px;min-width:0}
.item .nm em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.item .nm .guess{color:var(--tag-warn);font-size:12px;margin-left:4px}
.eat{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--em);color:var(--em);background:transparent;font-size:12px;line-height:1;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.eat:hover{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.item.done .nm{color:var(--muted);text-decoration:line-through}

.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.log .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.log .b{color:var(--muted);font-size:12px}
.stars{color:var(--tag-warn);letter-spacing:1px;font-size:13px}

.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rule{background:var(--bg);border-radius:10px;padding:10px 14px}
.rule b{display:block;font-size:14px}
.rule span{font-size:13px;color:var(--muted)}

/* generic list pages */
.rows{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:48px}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .sub{font-size:12px;line-height:18px;color:var(--muted)}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.box.on{background:var(--em);border-color:var(--em);color:var(--em-ink)}
.box.on::after{content:"";width:9px;height:5px;border:2px solid currentColor;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.row.done .grow > div:first-child{color:var(--muted);text-decoration:line-through}

.proj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.steps{display:flex;gap:4px;margin-top:10px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--nav-active)}
.steps span.on{background:var(--em)}
.steps-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:4px}
.steps-l span.on{color:var(--ink);font-weight:600}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal div{min-height:76px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;font-size:12px;line-height:16px;min-width:0}
.cal div:nth-child(7n){border-right:0}
.cal .dow{min-height:0;background:var(--bg);color:var(--muted);text-align:center;font-weight:600;padding:8px 0}
.cal .dn{font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .today .dn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--hl);color:var(--hl-ink);font-weight:700;line-height:1}
.ev{display:block;margin-top:4px;padding:2px 6px;border-radius:4px;background:var(--chat);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.bread{background:var(--hl);color:var(--hl-ink)}

.day{display:flex;flex-direction:column;gap:8px}
.day h3{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.day ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.mk{display:inline-block;width:52px;color:var(--muted);font-size:13px}

.ideas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.idea h3{font-size:15px;margin:0 0 6px}
.idea ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px}
.bar i{height:10px;border-radius:5px;background:var(--em);display:block}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

.input-row{display:flex;gap:8px}
.input-row input,.input-row select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--sheet);color:var(--ink);font:inherit;font-size:14px;min-width:0}
.input-row input{flex:1}


/* categories + intake form */
.legend{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.lg{height:32px;padding:0 12px 0 10px;border-radius:999px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:1;cursor:pointer;color:var(--ink)}
.lg:hover{background:var(--nav-hover)}
.lg[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);font-weight:600}
.lg[aria-pressed="true"] .n{color:var(--hl-ink)}
.lg .e,.emoin{font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
.lg .e{font-size:15px}
.lg .n{color:var(--muted);font-size:12px}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.mng{height:32px;padding:0 14px;margin-left:4px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--em);font-size:13px;font-weight:600;line-height:1;display:inline-flex;align-items:center;cursor:pointer}
.catbox{display:flex;flex-direction:column;gap:8px}
.catrow{display:grid;grid-template-columns:40px 52px minmax(0,1fr) auto;gap:8px;align-items:center}
.catrow input{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit;font-size:14px;padding:0 10px;min-width:0;width:100%}
.catrow input[type=color]{padding:3px;width:40px}
.catrow .emoin{text-align:center;padding:0}
.catrow .per{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.catrow .per input{width:64px}.catrow .per .unitin{width:48px;padding:0 6px;text-align:center}
.ctag{display:inline-flex;align-items:center;gap:6px;height:24px;font-size:12px;line-height:1;color:var(--muted);white-space:nowrap}
.bread-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.bread-grid .brands{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.panel{position:sticky;top:72px;background:var(--canvas);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:16px}
.panel input,.panel select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);font:inherit;font-size:14px;padding:0 12px;width:100%;min-width:0}
.panel label{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel{font-size:12px;line-height:1;color:var(--muted)}
.seg2{display:flex;gap:2px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg2 button{flex:1;height:32px;border:0;border-radius:8px;background:transparent;font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--em);color:var(--em-ink);font-weight:600}
.frow{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow .full{grid-column:1/-1}
.frow input,.frow select{height:36px;border-radius:8px}
.linkbtn{border:0;background:transparent;color:var(--em);font-size:13px;font-weight:600;cursor:pointer;height:28px;padding:0;text-align:left;justify-self:start}
.drop{color:var(--muted);font-weight:400;grid-column:1/-1}
.fsum{display:flex;justify-content:space-between;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px}
.btn.big{height:44px;font-size:15px}
.fmsg{font-size:13px;min-height:20px;color:var(--tag-sheet);font-weight:600}
.fmsg .err{color:var(--tag-warn)}
@media (max-width:900px){.bread-grid{grid-template-columns:minmax(0,1fr)}.panel{position:static;order:-1}}
@media (max-width:720px){.catrow{grid-template-columns:40px 52px minmax(0,1fr)}.catrow .per{grid-column:1/-1}}

/* undo */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;
  display:flex;align-items:center;gap:14px;height:44px;padding:0 8px 0 16px;border-radius:12px;background:var(--ink);color:var(--sheet);
  font-size:14px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100vw - 32px);white-space:nowrap}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--hl);color:var(--hl-ink);font-weight:700;font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center}
.btn[disabled]{opacity:.45;cursor:default}
.undo-btn{margin-left:6px}
.log-r{display:inline-flex;align-items:center;gap:12px}

/* journey board */

  <symbol id="i-truck" viewBox="0 0 20 20"><path d="M2.5 5.5h9v8h-9zM11.5 8.5h3l3 3v2h-6"/><circle cx="6" cy="14.5" r="1.5"/><circle cx="14.5" cy="14.5" r="1.5"/></symbol>
  <symbol id="i-box" viewBox="0 0 20 20"><path d="M3.5 6.8 10 3.5l6.5 3.3v6.4L10 16.5l-6.5-3.3zM3.5 6.8 10 10l6.5-3.2M10 10v6.5"/></symbol>
  <symbol id="i-snow" viewBox="0 0 20 20"><path d="M10 2.5v15M3.5 6.2l13 7.6M16.5 6.2l-13 7.6M8 4l2 1.6L12 4M8 16l2-1.6 2 1.6"/></symbol>
  <symbol id="i-clip" viewBox="0 0 20 20"><rect x="4.5" y="4" width="11" height="13" rx="2"/><path d="M8 3h4v2.5H8zM7.5 9.5h5M7.5 12.5h3.5"/></symbol>

<header class="top">

  <div class="scrim" id="scrim"></div>

    <nav class="nav" id="nav2"></nav>
  </aside>
  <main class="canvas"><div class="sheet"><div class="wrap" id="page"></div></div></main>

<script>
(function(){
var TODAY=new Date();TODAY.setHours(0,0,0,0);
var NAV1=[['todo','待辦清單','i-todo'],['calendar','行程日曆','i-cal'],['projects','案件進度','i-proj'],['worklog','工作日誌','i-log'],['reading','待閱讀','i-read'],['ideas','靈感筆記','i-idea']];
var NAV2=[['spending','我的消費','i-spend'],['bread','麵包貝果','i-bread']];

/* ---------- bread data: Wendy's real list ---------- */
// categories are editable (管理分類). per = how many units make one serving (one day).
var CATS=[
 {id:'plain',label:'空貝',emoji:'🥯',color:'#b7791f',per:1,unit:'顆'},
 {id:'filled',label:'夾餡',emoji:'🧀',color:'#d9468f',per:.5,unit:'顆'},
 {id:'slice',label:'酸種片',emoji:'🍞',color:'#5f8a1e',per:2.5,unit:'片'},
 {id:'other',label:'其他',emoji:'🥐',color:'#7d8590',per:1,unit:'個'}];
function cat(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[CATS.length-1]}
// the bagel's journey: making 製作中 → shipping 出貨中 → arrived 已抵達 → fridge 冰箱 → eaten (drag to 😋)
var STAGES=[
 {id:'making',label:'製作中',emoji:'🏭',ic:'i-oven',btn:'出貨了',bulk:'全部出貨了',to:'shipping',empty:'沒有在做的貝果'},
 {id:'shipping',label:'出貨中',emoji:'🚚',ic:'i-truck',btn:'到了',bulk:'全部到了',to:'arrived',empty:'還沒有在路上的'},
 {id:'arrived',label:'已抵達',emoji:'🏪',ic:'i-box',btn:'取件',bulk:'全部取件',to:'fridge',empty:'沒有等取貨的'},
 {id:'fridge',label:'冰箱',emoji:'🧊',ic:'i-snow',btn:null,empty:'冰箱空空的'}];
var PICKUP={'超商':'🏪','面交':'🤝','宅配':'🏠'};
var SOURCE={shop:{label:'店家直購',emoji:'🏬'},resale:{label:'網路收購',emoji:'🤝'},'':{label:'來源未填',emoji:'✎'}};
function ico(id){return '<svg class="ic" aria-hidden="true"><use href="#'+id+'"/></svg>'}
function stage(id){for(var i=0;i<STAGES.length;i++)if(STAGES[i].id===id)return STAGES[i]}
var HOMES=['台北','高雄'], here='台北';
// an order = one purchase: shop order (one brand, shipped to a store) or a resale buy-up (one seller, many brands)
var ORDERS={}, oid=0, uid=0, items=[];
function nid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function addOrder(o){var id=nid('o');o.id=id;ORDERS[id]=o;return id}
function seed(status,orderId,brand,list,home){list.forEach(function(x){items.push({id:nid('i'),name:x[0],qty:x[1],cat:x[2],guess:!!x[3],brand:brand,status:status,order:orderId,home:home||null,price:0})})}
var eaten=[];
var catFilter=null, showCats=false, showForm=false, flash='', editSrc=null, mTab='fridge';
var editId=null, delArm=false;
var showPaste=false, pasteText='', parsed=null, pendingPick=null, homeOpen={};
var folded={}; // making groups start folded
function newRow(b,c){return {brand:b||'',name:'',qty:1,cat:c||'filled',price:''}}
var form={source:'shop',seller:'',status:'making',date:'',pickup:'超商',home:'台北',rows:[newRow()]};

/* undo: snapshot before every change */
var undoStack=[];
function snap(label){undoStack.push({i:JSON.stringify(items),o:JSON.stringify(ORDERS),e:JSON.stringify(eaten),c:JSON.stringify(CATS),label:label});if(undoStack.length>30)undoStack.shift();setTimeout(scheduleSave,0)}
function undo(){var h=undoStack.pop();if(!h)return;items=JSON.parse(h.i);ORDERS=JSON.parse(h.o);eaten=JSON.parse(h.e);CATS=JSON.parse(h.c);render();scheduleSave();toast('已復原：'+h.label,false)}
var toastEl=null,toastT=null;
function toast(msg,canUndo){
  if(!toastEl){toastEl=document.createElement('div');toastEl.className='toast';toastEl.setAttribute('role','status');document.body.appendChild(toastEl);
    toastEl.addEventListener('click',function(e){if(e.target.closest('[data-undo]'))undo()})}
  toastEl.innerHTML='<span>'+esc(msg)+'</span>'+(canUndo?'<button type="button" data-undo>復原</button>':'');
  toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true},6000);
}

function srv(it){return it.qty/cat(it.cat).per}
function fmt(n){return (Math.round(n*10)/10).toString()}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function md(d){return (d.getMonth()+1)+'/'+d.getDate()}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function qtyTxt(it){return '×'+(it.qty===.5?'半':fmt(it.qty))+' '+cat(it.cat).unit}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return 'NT$'+Math.round(n).toLocaleString()}
function byId(id){for(var i=0;i<items.length;i++)if(items[i].id===id)return items[i]}
function sum(list){return list.reduce(function(a,it){return a+srv(it)},0)}
function inStage(s){return items.filter(function(it){return it.status===s})}

function moveTo(it,status,date,home){it.status=status;if(status==='fridge')it.home=home||it.home||here}
function place(it,refId,before){
  items.splice(items.indexOf(it),1);
  var ref=refId?byId(refId):null;
  if(!ref){items.push(it);return}
  var i=items.indexOf(ref);items.splice(before?i:i+1,0,it);
}
function eatOne(it){
  var c=cat(it.cat),used=Math.min(c.per,it.qty);
  it.qty=Math.max(0,Math.round((it.qty-c.per)*10)/10);
  eaten.unshift({d:md(TODAY),n:it.name,b:it.brand,per:used,id:it.id});
  if(it.qty<=0)it.status='done';
}

// each brand gets a stable hue → soft chip with a 1-letter avatar
function brandHue(b){var h=0;for(var i=0;i<b.length;i++)h=(h*31+b.charCodeAt(i))%360;return h}
function brandChip(b,sm){return '<span class="bchip'+(sm?' sm':'')+'" style="--h:'+brandHue(b)+'"><span class="bav">'+esc(Array.from(b)[0])+'</span>'+esc(b)+'</span>'}
function card(it,isNext){
  var c=cat(it.cat),st=stage(it.status);
  if(catFilter&&it.cat!==catFilter)return '';
  return '<div class="bcard" data-id="'+it.id+'">'+
    (isNext?'<span class="next">下一個吃</span>':'')+
    '<span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.3"/><circle cx="7" cy="3" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="7" cy="8" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="7" cy="13" r="1.3"/></svg></span>'+
    '<span class="cemo" style="background:'+c.color+'26" title="'+esc(c.label)+'">'+c.emoji+'</span>'+
    '<div class="bc-main"><div class="bc-name">'+esc(it.name)+(it.guess?'<span class="guess" title="分類是依品名猜的">?</span>':'')+'</div>'+
    '<div class="bc-sub">'+brandChip(it.brand,1)+'<span>'+qtyTxt(it)+' · '+fmt(srv(it))+' 份'+(it.price?' · '+money(it.price):'')+'</span>'+
    (it.status==='fridge'?'<button class="eat" type="button" data-eat="'+it.id+'">吃一份</button>':'<button class="mini" type="button" data-adv="'+it.id+'">'+st.btn+'</button>')+
    '</div></div></div>';
}
function orderGroup(o,list,st){
  var key=o.id+st.id,fold=(key in folded)?folded[key]:st.id==='making',s=SOURCE[o.source],brands={};list.forEach(function(it){brands[it.brand]=1});
  var who=o.source==='resale'?(o.seller?'收購 · '+o.seller:'網路收購'):o.source==='shop'?Object.keys(brands).join('、'):'來源未填';
  var meta=(st.id==='making'?(o.date?md(parseD(o.date))+' 出貨':'出貨日未填'):o.pickup)+' · '+fmt(sum(list))+' 份';
  var h='<div class="grp" data-order="'+o.id+'"><div class="grp-h one">'+
    '<button type="button" class="fold" data-fold="'+key+'" aria-expanded="'+!fold+'" aria-label="收合">'+(fold?'▸':'▾')+'</button>'+
    '<button type="button" class="src'+(o.source?'':' unset')+'" data-src="'+o.id+'">'+esc(who)+'</button>'+
    '<span class="gcnt">'+(st.id==='making'&&o.date?md(parseD(o.date))+' · ':'')+list.length+' 項</span></div>'+
    (fold?'':'<div class="grp-sub"><span>'+meta+'</span><button type="button" class="mini bulk" data-bulk="'+o.id+'" data-stage="'+st.id+'">'+st.bulk+'</button></div>');
  if(editSrc===o.id){
    h+='<div class="srcedit"><label><span class="flabel">來源</span><select data-oid="'+o.id+'" data-ok="source"><option value="shop"'+(o.source==='shop'?' selected':'')+'>店家直購</option><option value="resale"'+(o.source==='resale'?' selected':'')+'>網路收購</option><option value=""'+(!o.source?' selected':'')+'>未填</option></select></label>'+
       (o.source==='resale'?'<label><span class="flabel">賣家</span><input data-oid="'+o.id+'" data-ok="seller" value="'+esc(o.seller)+'" placeholder="誰釋出的"></label>':'')+
       '<label><span class="flabel">出貨日</span><input type="date" data-oid="'+o.id+'" data-ok="date" value="'+(o.date||'')+'"></label>'+
       '<label><span class="flabel">取貨方式</span><select data-oid="'+o.id+'" data-ok="pickup">'+Object.keys(PICKUP).map(function(k){return '<option'+(o.pickup===k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></label>'+
       '<button type="button" class="btn sm" data-src="'+o.id+'">完成</button></div>';
  }
  if(!fold)h+=list.map(function(it){return card(it,false)}).join('');
  return h+'</div>';
}

function pad(n){return ('0'+n).slice(-2)}
// what happens next for the freezer in the home you're in
function forecast(fs,A,S,Mk,FO,other){
  if(A.length){var e2=addDays(TODAY,Math.max(0,Math.floor(fs+sum(A))-1));return {k:'接下來',v:'先取件',d:'<b class="warn">'+A.length+' 項等取貨</b> · 取完可以吃到 '+md(e2)}}
  if(S.length)return {k:'接下來',v:'在路上',d:S.length+' 項快到了'};
  var end=addDays(TODAY,Math.max(0,Math.floor(fs)-1));
  var ds=Mk.map(function(it){return ORDERS[it.order]&&ORDERS[it.order].date}).filter(Boolean).sort();
  if(!ds.length)return {k:'接下來',v:'沒有下一批',d:here+' '+md(end)+' 吃完'};
  var arr=addDays(parseD(ds[0]),2),gap=Math.round((arr-addDays(end,1))/864e5);
  if(gap>0)return {k:'斷糧預警',v:'會空 '+gap+' 天',d:'<b class="warn">下一批 '+md(parseD(ds[0]))+' 才出貨</b>'+(sum(FO)?' · '+other+'有 '+fmt(sum(FO))+' 份可以帶':'')};
  return {k:'接下來',v:'來得及',d:'下一批 '+md(parseD(ds[0]))+' 出貨'};
}
function breadPage(){
  if(mode==='loading'||mode==='slow')return '<header class="ph"><div class="eyebrow">Bagel log</div><h1 class="title">麵包貝果</h1></header><div class="card note">'+(mode==='slow'?'暫時連不到資料庫，等一下再重新整理看看。':'讀取你的貝果資料中…')+'</div>';
  var F=inStage('fridge'),A=inStage('arrived'),S=inStage('shipping'),Mk=inStage('making');
  var other=HOMES[1-HOMES.indexOf(here)];
  var FH=F.filter(function(it){return it.home===here}),FO=F.filter(function(it){return it.home===other});
  var fs=sum(FH),road=sum(A)+sum(S)+sum(Mk),all=fs+sum(FO)+road;
  var stockEnd=addDays(TODAY,Math.max(0,Math.floor(fs)-1)),allEnd=addDays(TODAY,Math.max(0,Math.floor(all)-1));
  var todayN=eaten.filter(function(e){return e.d===md(TODAY)}).length;
  var h='';
  h+='<header class="ph"><div class="eyebrow">Bagel log</div><div class="head"><div><h1 class="title">麵包貝果</h1><p class="lede">一天吃一份：<mark>空貝 1 顆、夾餡半顆、酸種 2–3 片</mark></p></div>'+
     '<div class="hbtns"><span id="savestate" role="status">'+saveLabel()+'</span><button type="button" class="btn" data-act="undo"'+(undoStack.length?'':' disabled')+' title="Ctrl/⌘+Z"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg>復原</button><button type="button" class="btn" data-act="paste"><svg class="ic" aria-hidden="true"><use href="#i-clip"/></svg>貼上清單</button><button type="button" class="btn primary" data-act="form"><svg class="ic" aria-hidden="true"><use href="#i-snow"/></svg>進冷凍</button></div></div></header>';
  h+='<section class="stats compact">'+
     stat(here+'冰箱',fmt(fs),'份','可以吃到 '+md(stockEnd),1)+
     stat(other+'冰箱',fmt(sum(FO)),'份','另一個家')+
     stat('在路上',fmt(road),'份',A.length?'<b class="warn">'+A.length+' 項等取貨</b>':'製作中＋出貨中')+
     (function(){var fc=forecast(fs,A,S,Mk,FO,other);return stat(fc.k,fc.v,'',fc.d)})()+'</section>';
  var cc={};items.forEach(function(it){if(it.status==='fridge')cc[it.cat]=(cc[it.cat]||0)+1});
  h+='<div class="toolbar"><div class="homebar"><span class="note">我現在在</span><div class="homeseg" role="group" aria-label="現在在哪個家">'+HOMES.map(function(x){return '<button type="button" data-home="'+x+'" aria-pressed="'+(here===x)+'">'+x+'</button>'}).join('')+'</div></div>';
  h+='<div class="legend" role="group" aria-label="分類篩選"><span class="note">冰箱裡</span>';
  CATS.forEach(function(c){h+='<button type="button" class="lg" data-cat="'+c.id+'" aria-pressed="'+(catFilter===c.id)+'"><span class="e" aria-hidden="true">'+c.emoji+'</span>'+esc(c.label)+'<span class="n">'+(cc[c.id]||0)+'</span></button>'});
  h+='<button type="button" class="mng" data-act="cats" aria-expanded="'+showCats+'">管理分類</button></div></div>';
  if(showCats){
    h+='<div class="card catbox"><div class="note">改顏色、Emoji、名稱，以及「幾個算一份」。改完份數會馬上重算。</div>';
    CATS.forEach(function(c,i){h+='<div class="catrow"><input type="color" aria-label="顏色" value="'+c.color+'" data-ci="'+i+'" data-ck="color"><input aria-label="Emoji" value="'+c.emoji+'" data-ci="'+i+'" data-ck="emoji" class="emoin"><input aria-label="名稱" value="'+esc(c.label)+'" data-ci="'+i+'" data-ck="label"><span class="per"><input type="number" step="0.5" min="0.5" aria-label="幾個算一份" value="'+c.per+'" data-ci="'+i+'" data-ck="per"><input aria-label="單位" value="'+esc(c.unit)+'" data-ci="'+i+'" data-ck="unit" class="unitin">＝1 份</span></div>'});
    h+='<div style="display:flex;gap:8px"><button type="button" class="btn sm" data-act="addcat">＋ 新增分類</button><button type="button" class="btn sm primary" data-act="cats">完成</button></div></div>';
  }
  if(!items.length)h+='<div class="card note">'+(mode==='db'?'資料庫還是空的。按右上角「📋 貼上清單」，把現況貼進來就開始了。':'沒有資料。')+'</div>';
  h+='<div class="mtabs" role="tablist">'+STAGES.map(function(st){var n=inStage(st.id).length;return '<button type="button" role="tab" data-mtab="'+st.id+'" aria-selected="'+(mTab===st.id)+'">'+ico(st.ic)+''+st.label+'<span class="n">'+n+'</span></button>'}).join('')+'</div>';
  h+='<div class="board m-'+mTab+'">';
  STAGES.forEach(function(st){
    var list=inStage(st.id),body='';
    if(st.id==='fridge'){
      [here,other].forEach(function(hm){var g=list.filter(function(it){return it.home===hm}),end=addDays(TODAY,Math.max(0,Math.floor(sum(g))-1));
        var first=true;
        var hf=hm!==here&&!homeOpen[hm];
        body+='<div class="grp" data-home="'+hm+'"><div class="grp-h one"><button type="button" class="fold" data-homefold="'+hm+'" aria-expanded="'+!hf+'" aria-label="收合">'+(hf?'▸':'▾')+'</button><span class="homechip'+(hm===here?' on':'')+'">'+hm+'</span><span class="gcnt">'+fmt(sum(g))+' 份 · 到 '+md(end)+'</span></div>'+(hf?'':
          (g.length?g.map(function(it){var nx=hm===here&&first&&(!catFilter||it.cat===catFilter);var c=card(it,nx);if(c)first=false;return c}).join(''):'<div class="empty">'+hm+'的冰箱空空的</div>'))+'</div>'});
    } else {
      var seen={};list.forEach(function(it){var k=it.order||'none';if(!seen[k])seen[k]=[];seen[k].push(it)});
      Object.keys(seen).sort(function(a,b){var da=(ORDERS[a]&&ORDERS[a].date)||'',db=(ORDERS[b]&&ORDERS[b].date)||'';return da<db?-1:da>db?1:0}).forEach(function(k){
        var o=ORDERS[k]||{id:'none',source:'',seller:'',date:null,pickup:'超商'};body+=orderGroup(o,seen[k],st)});
    }
    h+='<div class="col st-'+st.id+'" data-drop="'+st.id+'"><div class="col-h"><span class="st-ico" aria-hidden="true">'+ico(st.ic)+'</span><b>'+st.label+'</b><span class="cnt">'+list.length+' 項 · '+fmt(sum(list))+' 份</span></div>'+
       '<div class="col-body">'+(body||'<div class="empty">'+ico(st.ic)+''+st.empty+'</div>')+'</div></div>';
  });
  h+='</div><p class="note">拖曳卡片換階段，冰箱裡上下拖可以排順序；把冰箱的貝果拖到跳出來的 😋 就吃掉一份。手機請按住 ⠿ 拖曳。</p>';
  h+='<section class="sec"><div class="sec-head"><h2>吃掉的</h2><span class="note">今天吃了 '+todayN+' 份 · 吃完可以給星星、寫一句心得</span></div>'+eatenList()+'</section>';
  h+='<p class="note"><span style="color:var(--tag-warn)">?</span> 標記的分類是我依品名先猜的，之後可以改。</p>';

/* ---------- 📋 paste a list in the same format Wendy writes ---------- */
function norm(s){return String(s).replace(/[\s（）()．・.]/g,'')}
function guessCat(name,unit,prev){
  if(unit==='片')return {cat:'slice',guess:false};
  if(prev)return {cat:prev.cat,guess:prev.guess};
  if(/空貝/.test(name))return {cat:'plain',guess:false};
  if(/乳酪|夾心|奶酥|奶蓋|優格|優酪|肉鬆|夾餡/.test(name))return {cat:'filled',guess:false};
  if(/迷你|魔杖|鹼水|酸種/.test(name))return {cat:'other',guess:true};
  return {cat:'filled',guess:true};
}
function parseList(txt){
  var known={};items.forEach(function(it){known[it.brand]=1});
  var secs=[],cur=null;
  txt.split(/\r?\n/).forEach(function(line){
    var l=line.trim();if(!l)return;
    if(!/^[\*\-•・·]/.test(l)){
      var sec={label:l,status:'making',home:null,date:null,rows:[]};
      if(/台北/.test(l)){sec.status='fridge';sec.home='台北'}
      else if(/高雄/.test(l)){sec.status='fridge';sec.home='高雄'}
      else if(/冰箱|冷凍|已取/.test(l)){sec.status='fridge';sec.home=here}
      else if(/等取貨|已抵達|待取/.test(l))sec.status='arrived';
      else if(/出貨中|運送|配送中/.test(l))sec.status='shipping';
      var m=l.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
      if(m&&sec.status==='making'){var y=TODAY.getFullYear(),mo=+m[1];if(mo<TODAY.getMonth()+1-5)y++;sec.date=y+'-'+pad(mo)+'-'+pad(+m[2])}
      cur=sec;secs.push(sec);return;
    }
    if(!cur){cur={label:'沒有標題',status:'fridge',home:here,date:null,rows:[]};secs.push(cur)}
    var s=l.replace(/^[\*\-•・·]\s*/,''),q=1,unit='';
    var qm=s.match(/[\*×xX＊]\s*([\d.]+)\s*(片|顆|根|個)?\s*$/);if(qm){q=+qm[1];unit=qm[2]||'';s=s.slice(0,qm.index).trim()}
    var brand='',name=s,bm=s.match(/^([^\-－:：]{1,12}?)\s*[\-－:：]\s*(.+)$/);
    if(bm){var p=bm[1].trim();if(known[p]||/^[A-Za-z0-9 &.']+$/.test(p)||(p.length<=4&&!/貝|麵包|酸種|迷你/.test(p))){brand=p;name=bm[2].trim()}}
    var prev=null;items.forEach(function(it){if(!prev&&(norm(it.name)===norm(name)||norm(it.name).indexOf(norm(name))===0||norm(name).indexOf(norm(it.name))===0))prev=it});
    if(!brand&&prev)brand=prev.brand;
    var g=guessCat(name,unit,prev);
    cur.rows.push({brand:brand||'未填',name:name,qty:q,cat:g.cat,guess:g.guess});
  });
  return secs.filter(function(s){return s.rows.length});
}

var mode='loading', ref=null, lastJSON=null, saving=false, again=false, saveT=null, saveState='', loadTimer=null;
function exportState(){return {v:1,items:items,orders:ORDERS,eaten:eaten.slice(0,300),cats:CATS}}
function importState(s){s=s||{};items=s.items||[];ORDERS=s.orders||{};eaten=s.eaten||[];if(s.cats&&s.cats.length)CATS=s.cats}
function scheduleSave(){if(mode!=='db')return;clearTimeout(saveT);saveT=setTimeout(flushSave,400)}
function flushSave(){
  if(saving){again=true;return}
  var json=JSON.stringify(exportState());if(json===lastJSON)return;
  saving=true;setSave('saving');
  ref.set(JSON.parse(json)).then(function(){lastJSON=json;setSave('ok')},function(){setSave('err')}).then(function(){saving=false;if(again){again=false;flushSave()}});
}
function setSave(s){saveState=s;var el=document.getElementById('savestate');if(el)el.innerHTML=saveLabel()}
function saveLabel(){
  if(mode==='local')return '<span class="ss warnc">示意圖 · 範例資料</span>';
  if(saveState==='saving')return '<span class="ss">儲存中…</span>';
  if(saveState==='err')return '<span class="ss warnc">沒存到，再改一次試試</span>';
  if(saveState==='ok')return '<span class="ss okc">已儲存 ✓</span>';
  return '<span class="ss okc">已同步</span>';
}
function quiet(){return current()==='bread'&&!editId&&!showForm&&!showPaste&&!pendingPick&&!(drag&&drag.started)}
function initData(){
  var c=window.claude;
  if(!c||!c.use)return localMode();
  c.use('db').then(function(db){
    if(!db)return localMode();
    ref=db.doc('bagel/state');
    loadTimer=setTimeout(function(){if(mode==='loading'){mode='slow';if(current()==='bread')render()}},10000);
    ref.onSnapshot(function(snap){
      clearTimeout(loadTimer);
      if(snap.metadata.hasPendingWrites)return;
      var first=mode!=='db';
      if(!snap.exists){mode='db';if(first)render();return}
      var json=JSON.stringify(snap.data());
      if(json===lastJSON&&!first)return;
      lastJSON=json;mode='db';importState(JSON.parse(json));
      if(first||quiet())render();
    },function(){clearTimeout(loadTimer);mode='slow';if(current()==='bread')render()});
  },localMode);
}
function localMode(){
  mode='local';
  fetch('bagel-sample.json').then(function(r){return r.ok?r:fetch('../bagel-sample.json')}).then(function(r){return r.ok?r.json():{}}).then(importState,function(){}).then(function(){if(current()==='bread')render()});
}

  if(t=e.target.closest('.homeseg [data-home]')){here=t.dataset.home;try{localStorage.setItem('wens-here',here)}catch(_){}render();return}

  if(t=e.target.closest('[data-cat]')){catFilter=catFilter===t.dataset.cat?null:t.dataset.cat;render();return}
  if(t=e.target.closest('[data-st]')){form.status=t.dataset.st;render();return}
  if(t=e.target.closest('[data-srcf]')){form.source=t.dataset.srcf;render();return}
  if(t=e.target.closest('[data-dropr]')){form.rows.splice(+t.dataset.dropr,1);render();return}
  if(t=e.target.closest('[data-fold]')){var fk=t.dataset.fold;folded[fk]=!((fk in folded)?folded[fk]:/making$/.test(fk));render();return}
  if(t=e.target.closest('[data-src]')){editSrc=editSrc===t.dataset.src?null:t.dataset.src;render();return}
  if(t=e.target.closest('[data-eat]')){it=byId(t.dataset.eat);snap('吃一份 '+it.name);eatOne(it);render();toast('吃了一份：'+it.name,true);return}
  if(t=e.target.closest('[data-adv]')){it=byId(t.dataset.adv);if(it.status==='arrived'){pendingPick={ids:[it.id]};render();return}var st=stage(it.status),nx=stage(st.to);snap(nx.label+' '+it.name);moveTo(it,st.to);place(it,null);render();toast(it.name+' → '+nx.label,true);return}
  if(t=e.target.closest('[data-bulk]')){
    var o=t.dataset.bulk,sg=stage(t.dataset.stage),nx2=stage(sg.to);
    var moved=items.filter(function(x){return x.status===sg.id&&(x.order||'none')===o});
    if(sg.id==='arrived'){pendingPick={ids:moved.map(function(x){return x.id})};render();return}
    snap(sg.bulk);
    moved.forEach(function(x){moveTo(x,sg.to);place(x,null)});
    folded[o+sg.to]=false;render();toast(moved.length+' 項 → '+nx2.label,true);return}
  if(t=e.target.closest('[data-uneat]')){
    var en=eaten[+t.dataset.uneat];snap('退回 '+en.n);it=byId(en.id);
    if(it){it.qty=Math.round((it.qty+en.per)*10)/10;if(it.status==='done')it.status='fridge'}
    eaten.splice(+t.dataset.uneat,1);render();toast('已退回冰箱：'+en.n,true);return}
  if(t=e.target.closest('[data-act]')){var a=t.dataset.act;
    if(a==='undo'){undo();return}
    if(a==='form')showForm=!showForm;

    if(a==='del'){var di=byId(editId);if(!di)return;if(!delArm){delArm=true;render();return}snap('刪除 '+di.name);items.splice(items.indexOf(di),1);editId=null;delArm=false;render();toast('已刪除：'+di.name,true);return}
    if(a==='cats')showCats=!showCats;
    if(a==='addcat'){snap('新增分類');CATS.push({id:'c'+Date.now(),label:'新分類',emoji:'🍩',color:'#4f7cc4',per:1,unit:'個'})}
    if(a==='addrow'){var last=form.rows[form.rows.length-1];form.rows.push(newRow(last.brand,last.cat))}
    render();return}
  if(t=e.target.closest('.bcard')){editId=t.dataset.id;delArm=false;render();return}
});

  if(t.dataset.ck){snap('修改分類');var c=CATS[+t.dataset.ci];c[t.dataset.ck]=t.dataset.ck==='per'?Math.max(.5,+t.value||1):t.value;render();return}

document.addEventListener('keydown',function(e){

  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&current()==='bread'){e.preventDefault();undo()}
});

/* ---------- the 😋 mouth: shows up while dragging, eats one serving on drop ---------- */
var mouth=document.createElement('div');mouth.className='mouth';mouth.setAttribute('aria-hidden','true');
mouth.innerHTML='<span class="m-emo">😋</span><span class="m-t">拖到這裡吃掉一份</span>';document.body.appendChild(mouth);
var mEmo=mouth.querySelector('.m-emo'),mTxt=mouth.querySelector('.m-t');
var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function mouthState(s){
  mouth.classList.toggle('show',s!=='hide');mouth.classList.toggle('open',s==='open');mouth.classList.toggle('no',s==='no');
  mEmo.textContent=s==='open'?'😮':s==='no'?'🙂':'😋';
  mTxt.textContent=s==='open'?'啊～':s==='no'?'先放進冰箱才能吃':'拖到這裡吃掉一份';
}
function crumbs(x,y){
  if(reduceMotion)return;
  for(var i=0;i<12;i++){var c=document.createElement('span');c.className='crumb';
    var a=Math.random()*Math.PI*2,r=40+Math.random()*50;
    c.style.left=x+'px';c.style.top=y+'px';c.style.setProperty('--dx',Math.cos(a)*r+'px');c.style.setProperty('--dy',(Math.sin(a)*r-20)+'px');
    c.style.background=['#d9a066','#b7791f','#f1d3a1','#8a5a2b'][i%4];
    document.body.appendChild(c);setTimeout(function(n){return function(){n.remove()}}(c),800)}
  var p=document.createElement('span');p.className='plus';p.textContent='+1 份';p.style.left=x+'px';p.style.top=(y-50)+'px';
  document.body.appendChild(p);setTimeout(function(){p.remove()},1100);
}
function chomp(ghost,it){
  var r=mouth.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  mEmo.textContent='😋';mTxt.textContent='好吃';mouth.classList.remove('open');mouth.classList.add('yum');
  ghost.style.transition='transform .22s ease-in';
  ghost.style.transform='translate('+(cx-ghost.offsetWidth/2)+'px,'+(cy-ghost.offsetHeight/2)+'px) scale(.55)';
  setTimeout(function(){ghost.classList.add('bite1')},180);
  setTimeout(function(){ghost.classList.add('bite2')},300);
  setTimeout(function(){ghost.classList.add('gone');crumbs(cx,cy-10);try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}},420);
  setTimeout(function(){ghost.remove();mouth.classList.remove('yum');mouthState('hide')},900);
  snap('吃一份 '+it.name);eatOne(it);render();toast('吃了一份：'+it.name,true);
}

/* ---------- drag & drop (pointer events: mouse drags the whole card, touch drags by the ⠿ grip) ---------- */
var drag=null;
function clearMarks(){document.querySelectorAll('.over,.ins-before,.ins-after').forEach(function(x){x.classList.remove('over','ins-before','ins-after')})}
page.addEventListener('pointerdown',function(e){
  var c=e.target.closest('.bcard');if(!c||e.target.closest('button')||e.button>0)return;
  if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;
  drag={id:c.dataset.id,x:e.clientX,y:e.clientY,el:c,started:false,target:null};
  if(e.pointerType!=='mouse')e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(!drag||drag.justDropped)return;
  if(!drag.started){
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<6)return;
    drag.started=true;var r=drag.el.getBoundingClientRect();
    drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
    drag.ghost=drag.el.cloneNode(true);drag.ghost.classList.add('ghost');drag.ghost.style.width=r.width+'px';document.body.appendChild(drag.ghost);
    drag.el.classList.add('dragging');document.body.classList.add('is-dragging');
    drag.fromFridge=byId(drag.id).status==='fridge';
    mouthState(drag.fromFridge?'show':'no');
  }
  e.preventDefault();
  drag.ghost.style.transform='translate('+(e.clientX-drag.dx)+'px,'+(e.clientY-drag.dy)+'px) rotate(2deg)';
  clearMarks();drag.target=null;
  // hit-test the mouth by its resting position, so a fast drag still lands even while it slides in
  var small=innerWidth<=720,mx=innerWidth/2,my=innerHeight-24-(small?64:75);
  if(Math.hypot(e.clientX-mx,e.clientY-my)<(small?78:92)){if(drag.fromFridge){mouthState('open');drag.target={eat:true}}else{mouthState('no')}return}
  var el=document.elementFromPoint(e.clientX,e.clientY);if(!el){return}
  mouthState(drag.fromFridge?'show':'no');
  var col=el.closest('.col');if(!col)return;
  var cb=col.querySelector('.col-body'),cr=cb.getBoundingClientRect();if(e.clientY<cr.top+36)cb.scrollTop-=10;else if(e.clientY>cr.bottom-36)cb.scrollTop+=10;
  var grp=el.closest('.grp'),zone=grp||col;zone.classList.add('over');
  var tgt={status:col.dataset.drop,date:null,home:grp?grp.dataset.home:null,ref:null,before:false};
  var c=el.closest('.bcard');
  if(c&&c.dataset.id!==drag.id){var r2=c.getBoundingClientRect();tgt.ref=c.dataset.id;tgt.before=e.clientY<r2.top+r2.height/2;c.classList.add(tgt.before?'ins-before':'ins-after')}
  drag.target=tgt;
  if(e.clientY<70)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-140)window.scrollBy(0,12);
},{passive:false});
function endDrag(){
  if(!drag||drag.justDropped)return;var d=drag;drag=null;
  if(!d.started)return;
  document.body.classList.remove('is-dragging');clearMarks();
  var it=byId(d.id),t=d.target;
  drag={justDropped:true};setTimeout(function(){drag=null},0);
  if(it&&t&&t.eat){chomp(d.ghost,it);return}
  d.ghost.remove();mouthState('hide');
  if(!it||!t){render();return}
  var from=it.status,st=stage(t.status);
  if(t.status==='fridge'&&!t.home&&from!=='fridge'){pendingPick={ids:[it.id]};render();return}
  snap((from===t.status?'排順序 ':st.label+' ')+it.name);
  var hm0=it.home;moveTo(it,t.status,t.date,t.home);place(it,t.ref,t.before);
  if(from===t.status&&t.status==='fridge'&&hm0!==it.home){render();toast(it.name+' 搬到'+it.home+'冰箱',true);return}
  render();toast(from===t.status?'已調整順序':it.name+' → '+st.label,true);
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
try{here=localStorage.getItem('wens-here')||here}catch(_){}
localMode();
render();
})();
